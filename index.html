<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>YAM mudou de endereço</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --fundo: #f3f3f0; --texto: #1d1d1f; --texto-suave: #5f5f63;
      --destaque: #1f3a5f; --destaque-texto: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fundo: #121212; --texto: #f2f2f2; --texto-suave: #a8a8ad; --destaque: #3d6ea8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 380px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    .novo { margin: 0 0 22px; font-size: 18px; font-weight: 700; color: var(--destaque); }
    .dica { color: var(--texto-suave); font-size: 14px; line-height: 1.4; }
    .botao {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: var(--destaque);
      color: var(--destaque-texto);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>O YAM mudou de endereço</h1>
  <p class="novo">jogo-yam.github.io</p>
  <a class="botao" href="https://jogo-yam.github.io/">Abrir o YAM novo</a>
  <p class="dica">Se o YAM estiver na tela de início do celular, abra o endereço novo,
    adicione-o à tela de início e apague o ícone antigo.</p>
</main>
<script>
  // o app antigo não roda mais aqui: tira o service worker e o cache dele
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  }
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
