<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>YAM - Tabela de Pontuação</title>

  <!-- PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

  <!-- Aplica o tema escolhido antes de desenhar a página, para não piscar. -->
  <script>
    try {
      const tema = localStorage.getItem("yam-tema");
      if (tema === "light" || tema === "dark") document.documentElement.dataset.theme = tema;
    } catch {}
  </script>
</head>
<body>

<!-- Jogo atual -->
<section id="tela-jogo">
  <div class="barra">
    <button id="botao-tema" class="tema" role="switch" aria-checked="false"
            aria-label="Modo escuro" onclick="alternarTema()">
      <span aria-hidden="true">☀️</span>
      <span class="trilho"><span class="bolinha"></span></span>
      <span aria-hidden="true">🌙</span>
    </button>
  </div>
  <h1>YAM – Tabela de Pontuação</h1>
  <p class="dica">Toque no nome de uma linha ou coluna para ver o que significa.</p>

  <div class="tabela">
  <table>
    <thead>
      <tr>
        <th class="mpb">MPB</th>
        <th>↓</th>
        <th>↑</th>
        <th>D</th>
        <th>S</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>

    <tfoot>
      <tr class="total-geral">
        <td class="mpb">TOTAL GERAL</td>
        <td colspan="4" id="total-geral-final">0</td>
      </tr>
    </tfoot>
  </table>
  </div>

  <div class="acoes">
    <button class="principal" onclick="novoJogo()">Novo Jogo</button>
    <button onclick="abrirHistorico()">Histórico</button>
  </div>
</section>

<!-- Lista de partidas salvas -->
<section id="tela-historico" hidden>
  <div class="topo">
    <button onclick="mostrarTela('tela-jogo')">← Voltar</button>
    <h1>Histórico</h1>
  </div>

  <div id="resumo-historico" class="resumo">
    <div><span id="qtd-partidas">0</span><small>partidas</small></div>
    <div><span id="recorde">0</span><small>recorde</small></div>
    <div><span id="media">0</span><small>média</small></div>
  </div>

  <ul id="lista-historico" class="lista-historico"></ul>
</section>

<!-- Detalhe de uma partida salva -->
<section id="tela-partida" hidden>
  <div class="topo">
    <button onclick="abrirHistorico()">← Voltar</button>
    <h1 id="titulo-partida">Partida</h1>
  </div>

  <div class="tabela">
  <table>
    <thead>
      <tr>
        <th class="mpb">MPB</th>
        <th>↓</th>
        <th>↑</th>
        <th>D</th>
        <th>S</th>
      </tr>
    </thead>

    <tbody id="tableBody-partida"></tbody>

    <tfoot>
      <tr class="total-geral">
        <td class="mpb">TOTAL GERAL</td>
        <td colspan="4" id="total-geral-partida">0</td>
      </tr>
    </tfoot>
  </table>
  </div>

  <div class="acoes">
    <button class="perigo" onclick="excluirPartida()">Excluir partida</button>
  </div>
</section>

<!-- Explicação das siglas -->
<div id="legenda" class="legenda" role="status" hidden>
  <strong></strong>
  <span></span>
</div>

<script src="app.js"></script>

<!-- Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
